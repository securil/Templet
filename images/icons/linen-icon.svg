<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <title>린넨 소재 아이콘</title>
  <!-- 배경 원 -->
  <circle cx="40" cy="40" r="38" fill="#e6f7f7" stroke="#00b2b2" stroke-width="2"/>
  
  <!-- 린넨 패턴 표현 -->
  <g fill="#00b2b2">
    <!-- 중앙 린넨 섬유 패턴 -->
    <path d="M20,30 Q30,25 40,30 Q50,35 60,30 L60,50 Q50,45 40,50 Q30,55 20,50 Z" fill="none" stroke="#00b2b2" stroke-width="2" stroke-linecap="round"/>
    <path d="M20,35 Q30,30 40,35 Q50,40 60,35 L60,55 Q50,50 40,55 Q30,60 20,55 Z" fill="none" stroke="#00b2b2" stroke-width="2" stroke-linecap="round"/>
    <path d="M20,25 Q30,20 40,25 Q50,30 60,25 L60,45 Q50,40 40,45 Q30,50 20,45 Z" fill="none" stroke="#00b2b2" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 린넨 섬유 작은 표현들 -->
    <line x1="25" y1="20" x2="25" y2="60" stroke="#00b2b2" stroke-width="1.5" stroke-dasharray="1,3"/>
    <line x1="35" y1="20" x2="35" y2="60" stroke="#00b2b2" stroke-width="1.5" stroke-dasharray="1,3"/>
    <line x1="45" y1="20" x2="45" y2="60" stroke="#00b2b2" stroke-width="1.5" stroke-dasharray="1,3"/>
    <line x1="55" y1="20" x2="55" y2="60" stroke="#00b2b2" stroke-width="1.5" stroke-dasharray="1,3"/>
    
    <!-- 린넨 특유의 마크 -->
    <text x="40" y="70" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="10" fill="#00b2b2">100% LINEN</text>
  </g>
</svg>
