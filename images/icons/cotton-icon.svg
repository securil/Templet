<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <title>코튼 소재 아이콘</title>
  <!-- 배경 원 -->
  <circle cx="40" cy="40" r="38" fill="#e6f7f7" stroke="#00b2b2" stroke-width="2"/>
  
  <!-- 코튼 꽃 표현 -->
  <g fill="none" stroke="#00b2b2" stroke-width="2">
    <!-- 코튼 꽃 중앙 -->
    <circle cx="40" cy="35" r="10" fill="#ffffff" stroke-width="1.5"/>
    
    <!-- 코튼 꽃잎들 -->
    <path d="M35,25 C30,20 25,22 25,30 C25,38 35,37 35,25" fill="#ffffff"/>
    <path d="M45,25 C50,20 55,22 55,30 C55,38 45,37 45,25" fill="#ffffff"/>
    <path d="M45,45 C50,50 55,48 55,40 C55,32 45,33 45,45" fill="#ffffff"/>
    <path d="M35,45 C30,50 25,48 25,40 C25,32 35,33 35,45" fill="#ffffff"/>
    
    <!-- 코튼 줄기 -->
    <path d="M40,45 L40,60" stroke-linecap="round"/>
    <path d="M40,60 L35,55" stroke-linecap="round"/>
    <path d="M40,60 L45,55" stroke-linecap="round"/>
    
    <!-- 코튼 부분 표현 - 솜털 같은 느낌 -->
    <circle cx="40" cy="35" r="6" fill="#ffffff" stroke="#00b2b2" stroke-width="0.5"/>
    <circle cx="37" cy="32" r="2" fill="#ffffff" stroke="#00b2b2" stroke-width="0.5"/>
    <circle cx="43" cy="32" r="2" fill="#ffffff" stroke="#00b2b2" stroke-width="0.5"/>
    <circle cx="37" cy="38" r="2" fill="#ffffff" stroke="#00b2b2" stroke-width="0.5"/>
    <circle cx="43" cy="38" r="2" fill="#ffffff" stroke="#00b2b2" stroke-width="0.5"/>
  </g>
  
  <!-- 코튼 레이블 -->
  <text x="40" y="70" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="10" fill="#00b2b2">100% COTTON</text>
</svg>
