<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <title>올시즌 아이콘</title>
  <!-- 배경 원 -->
  <circle cx="40" cy="40" r="38" fill="#e6f7f7" stroke="#00b2b2" stroke-width="2"/>
  
  <!-- 사계절 표현 -->
  <g stroke="#00b2b2" fill="none">
    <!-- 중앙 사계절 원형 레이아웃 -->
    <circle cx="40" cy="40" r="20" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- 봄 (꽃) -->
    <g transform="translate(40, 20)">
      <circle cx="0" cy="0" r="7" fill="#e6f7f7" stroke-width="1.5"/>
      <path d="M0,0 L-3,-4 Q-5,-6 -3,-8 Q-1,-10 1,-8 Q3,-6 1,-4 Z" fill="#e6f7f7" stroke-width="1"/>
      <path d="M0,0 L4,-3 Q6,-5 8,-3 Q10,-1 8,1 Q6,3 4,1 Z" fill="#e6f7f7" stroke-width="1"/>
      <path d="M0,0 L3,4 Q5,6 3,8 Q1,10 -1,8 Q-3,6 -1,4 Z" fill="#e6f7f7" stroke-width="1"/>
      <path d="M0,0 L-4,3 Q-6,5 -8,3 Q-10,1 -8,-1 Q-6,-3 -4,-1 Z" fill="#e6f7f7" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#00b2b2"/>
    </g>
    
    <!-- 여름 (태양) -->
    <g transform="translate(60, 40)">
      <circle cx="0" cy="0" r="7" fill="#e6f7f7" stroke-width="1.5"/>
      <!-- 태양 광선 -->
      <line x1="0" y1="-10" x2="0" y2="-12" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="7" y1="-7" x2="9" y2="-9" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="10" y1="0" x2="12" y2="0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="7" y1="7" x2="9" y2="9" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="0" y2="12" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-7" y1="7" x2="-9" y2="9" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-10" y1="0" x2="-12" y2="0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-7" y1="-7" x2="-9" y2="-9" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- 가을 (낙엽) -->
    <g transform="translate(40, 60)">
      <path d="M0,-7 Q5,-5 7,0 Q5,5 0,7 Q-5,5 -7,0 Q-5,-5 0,-7 Z" fill="#e6f7f7" stroke-width="1.5"/>
      <path d="M0,-4 L0,4" stroke-width="1"/>
      <path d="M-4,0 L4,0" stroke-width="1"/>
      <path d="M-3,-3 L3,3" stroke-width="1"/>
      <path d="M-3,3 L3,-3" stroke-width="1"/>
    </g>
    
    <!-- 겨울 (눈꽃) -->
    <g transform="translate(20, 40)">
      <path d="M0,0 L0,-7 M0,0 L0,7 M0,0 L-6,-3.5 M0,0 L6,-3.5 M0,0 L-6,3.5 M0,0 L6,3.5" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 눈송이 장식 -->
      <path d="M0,-7 L-1.5,-5.5 M0,-7 L1.5,-5.5" stroke-width="1" stroke-linecap="round"/>
      <path d="M0,7 L-1.5,5.5 M0,7 L1.5,5.5" stroke-width="1" stroke-linecap="round"/>
      <path d="M-6,-3.5 L-4.5,-3.5 M-6,-3.5 L-4.5,-5" stroke-width="1" stroke-linecap="round"/>
      <path d="M6,-3.5 L4.5,-3.5 M6,-3.5 L4.5,-5" stroke-width="1" stroke-linecap="round"/>
      <path d="M-6,3.5 L-4.5,3.5 M-6,3.5 L-4.5,5" stroke-width="1" stroke-linecap="round"/>
      <path d="M6,3.5 L4.5,3.5 M6,3.5 L4.5,5" stroke-width="1" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1.5" fill="#00b2b2"/>
    </g>
  </g>
  
  <!-- 올시즌 레이블 -->
  <text x="40" y="70" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="10" fill="#00b2b2">ALL SEASON</text>
</svg>
